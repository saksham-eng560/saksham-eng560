<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
  <title id="t">LeetCode stats</title>
  <desc id="d">Bars show the share of LeetCode users beaten per difficulty. 368 problems solved: 135 easy, 197 medium, 36 hard. Contest rating 1560, top 30.87%. Beats 98.2% of users. 36-day best streak. Snapshot October 2026.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #d3dbd5; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .big { font-size: 46px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; }
    .lab { font-size: 13px; fill: #849089; letter-spacing: 1.5px; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .ring { stroke-dasharray: 0 400; animation: ring 1.8s cubic-bezier(.2,.7,.2,1) 0.3s forwards; }
    @keyframes ring { to { stroke-dasharray: 308 400; } }
    .fade { opacity: 0; animation: f 0.8s ease forwards; }
    @keyframes f { to { opacity: 1; } }
  </style>
  <rect x="1" y="1" width="1198" height="228" rx="16" fill="#0a100c" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- ring: 368 solved, beats 98.2% -->
  <g transform="translate(120 115)">
    <circle r="62" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="10"/>
    <circle r="62" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" class="ring" transform="rotate(-90)"/>
    <text class="big" text-anchor="middle" y="10">368</text>
    <text class="lab" text-anchor="middle" y="32">SOLVED</text>
  </g>

  <!-- difficulty bars -->
  <g transform="translate(250 58)">
    <text class="lab">EASY</text><text x="380" text-anchor="end" class="mono" style="font-size:14px"><tspan fill="#2dd4bf">135</tspan><tspan fill="#849089"> · beats 93.8%</tspan></text>
    <rect y="10" width="380" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
    <rect y="10" width="356" height="8" rx="4" fill="#2dd4bf" class="bar" style="animation-delay:.2s"/>
    <text y="58" class="lab">MEDIUM</text><text x="380" y="58" text-anchor="end" class="mono" style="font-size:14px"><tspan fill="#fbbf24">197</tspan><tspan fill="#849089"> · beats 93.6%</tspan></text>
    <rect y="68" width="380" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
    <rect y="68" width="355" height="8" rx="4" fill="#fbbf24" class="bar" style="animation-delay:.4s"/>
    <text y="116" class="lab">HARD</text><text x="380" y="116" text-anchor="end" class="mono" style="font-size:14px"><tspan fill="#fb7185">36</tspan><tspan fill="#849089"> · beats 87.3%</tspan></text>
    <rect y="126" width="380" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
    <rect y="126" width="332" height="8" rx="4" fill="#fb7185" class="bar" style="animation-delay:.6s"/>
  </g>

  <!-- stat tiles -->
  <g class="fade" style="animation-delay:.5s">
    <g transform="translate(700 72)"><text class="big">1560</text><text y="26" class="lab">CONTEST RATING · TOP 30.87%</text></g>
    <g transform="translate(960 72)"><text class="big">98.2%</text><text y="26" class="lab">BEATS USERS</text></g>
    <g transform="translate(700 160)"><text class="big">36</text><text y="26" class="lab">DAY BEST STREAK</text></g>
    <g transform="translate(960 160)"><text class="big">90.8%</text><text y="26" class="lab">ACCEPTANCE</text></g>
  </g>
</svg>
