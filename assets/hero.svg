<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Saksham Verma</title>
  <desc id="desc">AI agents, offline-first AI and resilient backends. Software Engineering at DTU. Open to SDE internships.</desc>
  <defs>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="438" rx="22"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#6ee7b7"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; 1 0" keyTimes="0; 0.55; 1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="r0"><rect class="wipe" x="128" y="236" width="900" height="44"/></clipPath>
    <clipPath id="r1"><rect class="wipe" x="128" y="236" width="900" height="44"/></clipPath>
    <clipPath id="r2"><rect class="wipe" x="128" y="236" width="900" height="44"/></clipPath>
    <clipPath id="r3"><rect class="wipe" x="128" y="236" width="900" height="44"/></clipPath>
    <clipPath id="r4"><rect class="wipe" x="128" y="236" width="900" height="44"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .b1 { animation: drift1 18s ease-in-out infinite alternate; }
    .b2 { animation: drift2 22s ease-in-out infinite alternate; }
    .b3 { animation: drift3 26s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(-160px, 70px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(120px, -60px); } }
    @keyframes drift3 { from { transform: translate(0, 0); } to { transform: translate(-90px, -80px); } }
    .fade { opacity: 0; animation: up 0.9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; } .d5 { animation-delay: 1.1s; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .wipe { transform-box: fill-box; transform-origin: left center; }
    .role { opacity: 0; }
    .role0 { animation: role 15s infinite 1.2s; }
    .role1 { animation: role 15s infinite 4.2s; }
    .role2 { animation: role 15s infinite 7.2s; }
    .role3 { animation: role 15s infinite 10.2s; }
    .role4 { animation: role 15s infinite 13.2s; }
    @keyframes role { 0% { opacity: 1; } 18% { opacity: 1; } 20% { opacity: 0; } 100% { opacity: 0; } }
    #r0 rect { animation: type 15s steps(28, end) infinite 1.2s; transform: scaleX(0); }
    #r1 rect { animation: type 15s steps(28, end) infinite 4.2s; transform: scaleX(0); }
    #r2 rect { animation: type 15s steps(28, end) infinite 7.2s; transform: scaleX(0); }
    #r3 rect { animation: type 15s steps(28, end) infinite 10.2s; transform: scaleX(0); }
    #r4 rect { animation: type 15s steps(28, end) infinite 13.2s; transform: scaleX(0); }
    @keyframes type { 0% { transform: scaleX(0); } 8% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) 1.4s forwards, pulse 3s ease-in-out 2.6s infinite; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .dot { animation: ping 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="#060807"/>
    <g filter="url(#blur)" opacity="0.9">
      <circle class="b1" cx="900" cy="130" r="170" fill="#10b981" fill-opacity="0.55"/>
      <circle class="b2" cx="1060" cy="330" r="150" fill="#0e7490" fill-opacity="0.55"/>
      <circle class="b3" cx="760" cy="360" r="130" fill="#4338ca" fill-opacity="0.5"/>
    </g>
    <rect width="1200" height="440" fill="url(#grid)"/>
  </g>
  <rect x="1" y="1" width="1198" height="438" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <g class="fade d1">
    <text x="104" y="74" class="mono" font-size="15" fill="#849089" letter-spacing="1">~/saksham-eng560 <tspan fill="#34d399">$</tspan> cat README.md</text>
  </g>

  <g class="fade d2">
    <text x="100" y="170" font-size="96" font-weight="800" letter-spacing="-3" fill="url(#shine)">Saksham Verma</text>
  </g>

  <g class="fade d3">
    <text x="104" y="216" font-size="25" font-weight="600" fill="#d3dbd5">Agents, offline-first AI and backends that keep working. Built, shipped, tested.</text>
  </g>

  <!-- rotating "building" line -->
  <g class="fade d4">
    <text x="104" y="266" class="mono" font-size="22" fill="#34d399"><tspan class="caret">›</tspan></text>
    <g clip-path="url(#r0)"><text class="role role0 mono" x="128" y="266" font-size="22" fill="#9aa69e">building <tspan fill="#ffffff">AI agents</tspan></text></g>
    <g clip-path="url(#r1)"><text class="role role1 mono" x="128" y="266" font-size="22" fill="#9aa69e">building <tspan fill="#ffffff">offline-first AI</tspan></text></g>
    <g clip-path="url(#r2)"><text class="role role2 mono" x="128" y="266" font-size="22" fill="#9aa69e">building <tspan fill="#ffffff">resilient backends</tspan></text></g>
    <g clip-path="url(#r3)"><text class="role role3 mono" x="128" y="266" font-size="22" fill="#9aa69e">building <tspan fill="#ffffff">logistics intelligence</tspan></text></g>
    <g clip-path="url(#r4)"><text class="role role4 mono" x="128" y="266" font-size="22" fill="#9aa69e">writing <tspan fill="#ffffff">fast algorithms in C++</tspan></text></g>
  </g>

  <g class="fade d4">
    <text x="104" y="306" font-size="17" fill="#849089">Software Engineering @ DTU · 8.8 CGPA · 368 LeetCode · 1560 contest rating · GSSoC 2026 · Delhi, India</text>
  </g>

  <g class="fade d5">
    <circle cx="112" cy="364" r="6" fill="#34d399"/>
    <circle class="dot" cx="112" cy="364" r="6" fill="#34d399"/>
    <text x="132" y="377" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-1">open to <tspan fill="url(#accent)">SDE &amp; AI/ML internships</tspan></text>
    <rect class="bar" x="132" y="396" width="90" height="5" rx="2.5" fill="#34d399"/>
  </g>
</svg>
